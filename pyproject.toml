[project]
name = "chat-app-backend"
version = "0.0.1"
description = "Backend for DE chat agent"
authors = [
    {name = "Anatoliy A Aksenov",email = "anatoliy@aksenov.org"}
]
license = {text = "MIT"}
package-mode = false
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.116.1,<=1.0)",
    "langchain (>=0.3.27,<0.4.0)",
    "langgraph (>=0.6.5,<0.7.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "langchain-mcp-adapters (>=0.1.9,<0.2.0)",
    "langchain-openai (>=0.3.32,<0.4.0)",
    "ldap3 (>=2.9.1,<3.0.0)",
    "langgraph-checkpoint-postgres (>=2.0.23,<3.0.0)",
    "psycopg[binary,pool] (>=3.2.10,<4.0.0)",
    "langfuse (>=3.5.2,<4.0.0)",
    "pymupdf (==1.23.8)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "xlrd (>=2.0.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
